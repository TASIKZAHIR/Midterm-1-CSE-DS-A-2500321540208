<!DOCTYPE html>
<html>
<head>
  <title>Add Course</title>
  <link rel="stylesheet" href="practical.css">
</head>
<body>

  <div class="box">
    <h2>Add Course</h2>

    <form action="/add" method="POST">
      <input type="number" name="Id" placeholder="Id (e.g. 103)" required><br><br>
      <input type="text" name="Coursename" placeholder="Course Name" required><br><br>
      <input type="text" name="Coursecode" placeholder="Course Code" required><br><br>
      <input type="text" name="Department" placeholder="Department" required><br><br>
      <button type="submit">Add Course</button>
    </form>

    <br>
    <a href="/courses">View All Courses (101 & 102)</a>
  </div>
  div
  

</body>
</html>
